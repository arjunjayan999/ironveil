name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint - Typecheck - Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

      - name: Build shared packages
        run: |
          pnpm --filter @ironveil/shared-types run build
          pnpm --filter @ironveil/logger run build

      - name: Typecheck all workspaces
        run: pnpm -r run typecheck

      - name: Backend tests
        run: pnpm --filter @ironveil/backend vitest run --coverage
        env:
          NODE_ENV: test

      - name: Threat Engine tests
        run: pnpm --filter @ironveil/threat-engine vitest run --coverage
        env:
          NODE_ENV: test

      - name: Frontend tests
        run: pnpm --filter @ironveil/frontend vitest run --coverage
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/backend/coverage/
            apps/threat-engine/coverage/
            apps/frontend/coverage/
          retention-days: 7