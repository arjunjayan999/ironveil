name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push threat-engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/threat-engine/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-threat-engine:latest
            ${{ env.IMAGE_PREFIX }}-threat-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push sensor-simulator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sensor-simulator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-sensor-simulator:latest
            ${{ env.IMAGE_PREFIX }}-sensor-simulator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push ai-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ai-service:latest
            ${{ env.IMAGE_PREFIX }}-ai-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Images pushed" >> $GITHUB_STEP_SUMMARY
          echo "- backend: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- threat-engine: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- sensor-simulator: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ai-service: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- frontend: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY